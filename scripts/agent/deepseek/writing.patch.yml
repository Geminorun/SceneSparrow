# Explicit allowlist: no base bundle, tools, MCP, plugins, or telemetry.
- insert:
    - id: llm
      name: "@deepseek-ai/dsh-llm"
    - id: session
      name: "@deepseek-ai/dsh-session"
    - id: session-projection
      name: "@deepseek-ai/dsh-session-projection"
    - id: agent
      name: "@deepseek-ai/dsh-agent"
    - id: system-prompt
      name: "@deepseek-ai/dsh-system-prompt"
      config:
        {
          "personaPrefix": "You are a writing assistant. Use only the text supplied by the user. Return text; SceneSparrow owns document changes.",
        }
    - id: tools
      name: "@deepseek-ai/dsh-tools"
    - id: tool-executor-native
      name: "@deepseek-ai/dsh-tool-executor-native"
    - id: agent-loop
      name: "@deepseek-ai/dsh-agent-loop"
      config: { "agents": [] }
    - id: session-persistence-jsonl
      name: "@deepseek-ai/dsh-session-persistence-jsonl"
      config: { "root": "/tmp/unused" }
    - id: llm-deepseek-api-key
      name: "@deepseek-ai/dsh-llm-deepseek-api-key"
      config: { "baseURL": "http://127.0.0.1:48191/anthropic" }
    - id: acp-app
      name: "@deepseek-ai/dsh-acp-app"
    - id: acp
      name: "@deepseek-ai/dsh-acp"
      inject: [acpAppStartup]
      config: { "provider": "deepseek-official", "model": "deepseek-flash" }
    - id: writing-profile-guard
      name: /opt/dsh/guard.mjs
- id: acp
  inject: [acpAppStartup, writingProfileGuard]
