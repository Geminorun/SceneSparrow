[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/service"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
scenesparrow-domain = { path = "crates/domain" }
scenesparrow-application = { path = "crates/application" }
scenesparrow-infrastructure = { path = "crates/infrastructure" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
