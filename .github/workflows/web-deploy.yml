name: Private Web deployment

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified image to the single shared workspace (release branch or version tag only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scenesparrow-web-deployment
  cancel-in-progress: false

jobs:
  policy:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.policy.outputs.channel }}
      ref: ${{ steps.policy.outputs.ref }}
      version: ${{ steps.policy.outputs.version }}
      should_publish: ${{ steps.policy.outputs.should_publish }}
      should_deploy: ${{ steps.policy.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - id: policy
        run: node scripts/release/policy.mjs
        env:
          REQUEST_DEPLOY: ${{ inputs.deploy || false }}
          EVENT_DELETED: ${{ github.event.deleted || false }}

  checks:
    needs: policy
    uses: ./.github/workflows/ci.yml
    with:
      full_browser: true

  release_gate:
    name: Release gate
    needs: [policy, checks]
    if: ${{ !cancelled() && github.event.deleted != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful release prerequisites
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [[ "$POLICY_RESULT" != success || "$CHECKS_RESULT" != success ]]; then
            echo "::error title=Web release blocked::Release policy: $POLICY_RESULT. Foundation checks: $CHECKS_RESULT. Image build and deployment blocked."
            exit 1
          fi

  image:
    needs: [policy, release_gate]
    if: needs.release_gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      name: ${{ steps.identity.outputs.name }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - id: identity
        run: printf 'name=ghcr.io/%s/web\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            SCENESPARROW_BUILD_SHA=${{ github.sha }}
          load: true
          push: false
          tags: scenesparrow-web:verified
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: node scripts/web/container-smoke.mjs scenesparrow-web:verified
      - name: Revalidate tested release ref before publication
        if: needs.policy.outputs.should_publish == 'true'
        run: node scripts/release/policy.mjs
        env:
          REQUEST_DEPLOY: ${{ inputs.deploy || false }}
          EVENT_DELETED: ${{ github.event.deleted || false }}
      - name: Publish the tested image
        id: publish
        if: needs.policy.outputs.should_publish == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_NAME: ${{ steps.identity.outputs.name }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          docker tag scenesparrow-web:verified "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          digest=$(docker image inspect "$IMAGE_NAME:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          digest=${digest##*@}
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [policy, release_gate, image]
    if: >-
      needs.release_gate.result == 'success' &&
      needs.image.result == 'success' &&
      needs.policy.outputs.should_deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: web-production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Revalidate tested release ref before deployment
        run: node scripts/release/policy.mjs
        env:
          REQUEST_DEPLOY: ${{ inputs.deploy || false }}
          EVENT_DELETED: ${{ github.event.deleted || false }}
      - run: node scripts/web/deploy-client.mjs
        env:
          IMAGE_NAME: ${{ needs.image.outputs.name }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          DEPLOY_HOST: ${{ secrets.WEB_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.WEB_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.WEB_DEPLOY_KNOWN_HOSTS }}
          OPERATOR_USERNAME: ${{ secrets.WEB_OPERATOR_USERNAME }}
          OPERATOR_PASSWORD: ${{ secrets.WEB_OPERATOR_PASSWORD }}
          OPERATOR_AUTH: ${{ secrets.WEB_OPERATOR_AUTH }}
          PUBLIC_ORIGIN: ${{ vars.WEB_PUBLIC_ORIGIN }}
          DEPLOY_SSH_PORT: ${{ vars.WEB_DEPLOY_SSH_PORT }}
          DEPLOY_DIR: ${{ vars.WEB_DEPLOY_DIR }}
          WEB_PORT: ${{ vars.WEB_PORT }}
