name: Foundation checks

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full_browser:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Build and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - &setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - &setup-pnpm
        uses: pnpm/action-setup@v4
      - &install-rust
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - &install-packages
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:integration

  browser:
    name: ${{ matrix.suite == 'smoke' && 'Browser smoke' || format('Browser ({0}/3)', matrix.suite) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON((inputs.full_browser || github.event_name == 'workflow_dispatch') && '["1","2","3"]' || '["smoke"]') }}
    steps:
      - *checkout
      - *setup-node
      - *setup-pnpm
      - *install-rust
      - *install-packages
      - run: cargo build --locked -p scenesparrow-service
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - if: matrix.suite == 'smoke'
        run: pnpm test:e2e:smoke
      # Diagnostics exercises the Web gateway with its production static files.
      - if: matrix.suite != 'smoke'
        run: pnpm --filter @scenesparrow/web build
      - if: matrix.suite != 'smoke'
        env:
          BROWSER_SHARD: ${{ matrix.suite }}
        run: pnpm test:e2e --shard="$BROWSER_SHARD/3" --reporter=list
      - if: matrix.suite == '3'
        run: pnpm test:e2e:markdown --reporter=list
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  foundation:
    needs: [checks, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require each check to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success
