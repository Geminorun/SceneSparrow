name: Foundation checks

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Build and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - &setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - &setup-pnpm
        uses: pnpm/action-setup@v4
      - &install-rust
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - &install-packages
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:integration

  browser:
    name: Browser (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - *checkout
      - *setup-node
      - *setup-pnpm
      - *install-rust
      - *install-packages
      - run: cargo build --locked -p scenesparrow-service
      # Diagnostics exercises the Web gateway with its production static files.
      - run: pnpm --filter @scenesparrow/web build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3
      - if: matrix.shard == 3
        run: pnpm test:e2e:markdown
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  foundation:
    needs: [checks, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require each check to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success
